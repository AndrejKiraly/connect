spring.application.name=connect

spring.profiles.active=dev

spring.datasource.url=jdbc:postgresql://localhost:5433/connect
spring.datasource.username=connect
spring.datasource.password=connect

# --- JPA / Hibernate ---
# Schemu vlastni Flyway, takze Hibernate NESMIE vytvarat/menit tabulky.
# 'validate' = pri starte iba skontroluje, ze @Entity sedia s tabulkami.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never

server.servlet.session.timeout=14d

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

app.mail.from=no-reply@connect.local
app.password-reset.link-base=http://localhost:8080/reset-password
