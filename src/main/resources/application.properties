spring.application.name=connect

# --- Datasource (Postgres v Dockeri, host port 5433) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/connect
spring.datasource.username=connect
spring.datasource.password=connect

# --- JPA / Hibernate ---
# Schemu vlastni Flyway, takze Hibernate NESMIE vytvarat/menit tabulky.
# 'validate' = pri starte iba skontroluje, ze @Entity sedia s tabulkami.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
# Migracie sa hladaju v classpath:db/migration (V1__*.sql, V2__*.sql, ...)
spring.flyway.enabled=true